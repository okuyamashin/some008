その瞬間、刃がまばゆい光を放ち、森じゅうの鳥がいっせいに飛び立った。光はしばらく空き地を満たし、やがて静かに刃の中へ吸い込まれていった。手の中の剣は、羽根のように軽い。

君は聖剣エクスカリバーを手に入れた！

錆びた剣は、岩の上にそっと置いていくことにした。ここまで一緒に旅をしてきた相棒だ。君は小さく礼を言い、新しい剣を背に負った。体の奥から、不思議な力が湧いてくるのを感じる。

地図によれば、竜の迷宮はもうすぐだ。
"""
