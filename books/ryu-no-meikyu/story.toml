image = "01c_village_request_v1"
text = """
君は長い旅の途中、山あいの小さな村にたどり着いた。夕暮れの広場には、不安げな顔の村人たちが集まり、ひそひそと何かを話し合っている。

よそ者の君に気づくと、白いひげの村長が杖をつきながら進み出て、深く頭を下げた。

「旅のお方。北の山の洞窟に黒い竜が棲みつき、夜ごと家畜をさらっていくのです。もう羊も牛も半分になってしまいました。このままでは、村は冬を越せません」

村長の背後で、母親が幼子をぎゅっと抱きしめた。遠い山の頂からは、細い煙が一筋、赤い空へ昇っている。

君の腰にあるのは、刃こぼれした錆びた剣が一本きり。腕に自信があるわけでもない。それでも村人たちは、すがるような目で君を見つめている。
"""
choices = [
  { label = "依頼を引き受ける", to = 7 },
  { label = "丁重に断る", to = 12 },
]

