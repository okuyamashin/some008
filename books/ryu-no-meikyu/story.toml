text = """
「……そうですか」村長は肩を落とし、村人たちは黙って家へ戻っていった。

君はなんとなく村に居着き、空き家を借りて畑を耕しはじめた。春に種をまき、夏に草を抜き、秋に収穫する。それを三十年繰り返すうちに、君は村一番のカブ名人として知られるようになった。君のカブは大きく、白く、そして甘い。

ある日、畑に一台の荷車がやってきた。積まれているのは山のような金貨と宝石。輝く鎧の若い騎士が、胸を張って言った。

「北の竜は、このわたしが倒しました！　この村が困っていると聞いて、はるばる参ったのです」

君は黙って畑にかがみこみ、今年いちばんの大カブを引き抜くと、両手でうやうやしく差し出した。

騎士は、とても困った顔をした。
"""

[[paragraph]]
