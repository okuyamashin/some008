key = "02c_forest_sword"
kind = "choice"
image = "02c_forest_sword_v2"
text = """
森は奥へ進むほど暗く、静かになっていった。ねじれた木の根が道をふさぎ、白い霧が足もとを流れていく。鳥の声さえ、いつの間にか聞こえなくなった。

やがて木々がひらけ、小さな空き地に出た。その真ん中に、苔むした大きな岩がある。

岩には、一振りの剣が深々と突き立っていた。十字の鍔に、丸い柄頭。ずいぶん古いものなのに、刃には錆ひとつ浮いていない。

梢の隙間から一筋の光が差し込み、まるで君を待っていたかのように、剣だけを照らしている。村長の話していた言い伝えの場所は、きっとここだ。

君は自分の腰の剣に目をやった。錆びて、刃こぼれした、頼りない剣だ。これで竜と戦えるとは、とても思えない。
"""
choices = [
  { label = "そっとしておいて先を急ぐ", to = 14 },
  { label = "剣を抜く", to = 10 },
]

