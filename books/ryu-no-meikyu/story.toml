君は剣を横目に、空き地を通り過ぎた。抜けなかったら恥ずかしいし、なにより先を急ぐ旅なのだ。

そのすぐあと、木の実を拾いに来た村の子どもが、何気なく岩の剣に手をかけた。剣はするりと抜け、天からまばゆい光が降りそそいだ。

こうして、八歳の勇者が誕生した。

勇者には、荷物持ちが必要だった。寝袋、鍋、着替え、おやつ、絵本、それにペットの小鳥。君はそれをすべて背負い、小さな勇者のあとをどこまでもついていった。勇者は歩くのが速く、よく寄り道をした。

勇者は見事に竜を倒し、その名は歌になって国じゅうに広まった。歌は七番まであり、どの番にも勇者の名前が出てくる。荷物持ちの名前は、一度も出てこない。
