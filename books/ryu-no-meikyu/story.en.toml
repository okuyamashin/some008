back = 15
text = """
Thou turnest about and runnest back the way thou camest with all thy might. Behind thee roareth the fire, but not once dost thou look back.

Returned unto the village, thou tellest thy tale in the tavern: how huge was the dragon, how terrible, and how valiantly thou didst fight.

From that night forth, thou standest every evening upon a bench in the tavern and tellest the selfsame tale. Each night it groweth a little greater, until the dragon is as big as a mountain and hath three heads, and thou didst battle it three days and three nights.

None setteth down their cards. The tapster polisheth his tankards still. Beneath the table a hound yawneth wide.

From the northern mountain a thin thread of smoke riseth yet. Of all who hear thy tale, not one believeth it.
