image = "05c_lair_dragon_v1"
text = """
It is a cavern of wondrous size. The floor is heaped high with gold, and goblets and jewels glitter in the firelight. Amongst them thou seest the bells of the sheep stolen from the village.

Upon the mountain of treasure, the black dragon slowly raiseth itself. Its outspread wings reach from wall to wall, and in its open throat the fire doth swirl.

"Well hast thou come thus far, little one. But here thy journey endeth."

The dragon's voice shaketh the cavern, and sand trickleth down from the roof. Thy knees threaten to fail thee.

In that moment the holy sword upon thy back groweth faintly warm, as though it would say: Draw me. Thou art no longer a wanderer with naught but a rusted blade.
"""
choices = [
  { label = "If thou wouldst flee with all speed", to = 5 },
  { label = "If thou wilt draw the holy sword and stand thy ground", to = 8 },
]

[[paragraph]]
number = 8
key = "05r_lair_treasure"
kind = "ending"
image = "05r_lair_treasure_v1"
text = """
Thou drawest forth the holy sword and runnest at the dragon.

The fire that the dragon breatheth is cloven in twain the moment it toucheth the light of the blade, and the hot wind grazeth thy cheek. Up the mountain of treasure thou climbest, and with all thy might thou bringest down the sword.

A long, long roar echoeth through the cavern, and then all is still. The dragon's vast body slowly crumbleth, and gold pours rattling down the heap.

Some days hence, the village square is decked with flowers and banners. When the cart arriveth, piled high with treasure, the villagers cry out for joy and the children run after it. Upon the cart lieth also the dragon's great horn. The elder raiseth both his hands to heaven and thanketh thee again and again.

Thus didst thou become the hero who saved the village, and the tale of thy journey shall long be told therein.
"""

