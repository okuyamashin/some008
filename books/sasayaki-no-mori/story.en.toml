text = """
With a great cry, thou springest at the King of Wolves.

The King stepeth lightly aside. Carried on by thine own rush, thou tumblest into the grass, right on top of the cubs that were playing there.

The cubs are overjoyed. A new plaything hath come!

They nibble thine ears, climb upon thy back, and drag thee about like a blanket. When thou triest to flee, the whole litter giveth chase. The King of Wolves watcheth, and yawneth wide.

Many years have passed. In the village it is still whispered that a traveller is being raised by wolves deep in the wood.

In truth, of course, it is thou that art raising the cubs.
