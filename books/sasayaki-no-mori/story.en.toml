image = "04c_choice_v1"
text = """
The wolves lead thee down into the vale, and thou comest to a mossy glade. There little folk in pointed caps sit in a ring, holding a feast.

"Welcome, traveller! Come, eat and drink with us!"

A pie of nuts, cakes of honey, a steaming soup of mushrooms. All look wondrous good.

Yet thou markest that thy wolf guides have stopped short of the glade, heads low, and will come no nearer. And beneath the feet of the little folk there falleth not a single shadow.

"Come, come, be not shy."

A little man holdeth out to thee a bowl brimming with soup.
"""
choices = [
  { label = "If thou wilt join the feast and drink the soup", to = 3 },
  { label = "If thou wouldst thank them and hasten on", to = 11 },
]

