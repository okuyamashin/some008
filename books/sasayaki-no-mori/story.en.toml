text = """
Thou takest the bowl and sippest the mushroom soup. It is delicious beyond words.

Of a sudden the world about thee groweth larger and larger. The pie is like a boulder, the bowl like a pond. Nay, it is thou that hast grown small.

"Welcome, new friend!" cry the little folk, and toss thee aloft for joy.

From that day forth thou joinest their feast every night. The little folk never miss a night of feasting, and it is the rule that the newest of them must wash up.

