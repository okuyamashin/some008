text = """
In the depths of the vale lieth a quiet glade where the moonlight falleth. Upon a great rock in its midst sitteth a grey wolf so huge thou must crane thy neck to see him. It is the King of Wolves, and his pack standeth all about.

The King looketh down upon thee with golden eyes, and in them dwelleth not so much wrath as a deep sorrow.

"Child of men, why art thou come? Men broke the ancient pact. Therefore have I shut the wood."

As one, the wolves growl and bare their fangs.

In that moment the Moon Horn in thy bosom beginneth to glow softly in the moonlight. Was not this horn handed down in the village since time out of mind?
"""
choices = [
  { label = "If thou wouldst spring upon the King of Wolves", to = 5 },
  { label = "If thou wilt sound the Moon Horn aloud", to = 8 },
]

[[paragraph]]
number = 8
key = "05r_ending"
kind = "ending"
image = "05r_ending_v1"
text = """
Thou settest the Moon Horn to thy lips and blowest with all thy breath.

The clear note ringeth through the moonlit vale. The pack ceaseth its growling, and the King of Wolves closeth his eyes.

"That sound... I had forgotten it."

Long ago, the village and the wolves made a pact. The village would not despoil the wood; the wolves would guard the village. The horn was the token of that pact. When the village forgot its promise and the horn cracked, the wolves too shut their hearts.

Some days hence, thou leadest the King of Wolves to the village. Hearing the horn, the elder weepeth and boweth low.

Thus was the pact renewed, and the bounty of the wood returned to the village. Now the nightly howling is the village's lullaby.
"""

