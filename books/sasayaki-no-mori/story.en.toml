image = "04r_result_v1"
text = """
"I thank you, but I must hasten on."

Thou bowest courteously, and the little folk look at one another, much put out. In the blink of an eye, the feast is gone.

All that remaineth is a ring of white mushrooms and a mossy stump. What thou tookest for a pie is but a heap of pine cones.

The wolves run to thee and lick thy hand, as if to say they are glad thou art unharmed.

From deep in the vale cometh a long, low howl, a voice that maketh every tree in the wood to tremble. The wolves lay back their ears and look up at thee. Beyond lieth the King of Wolves.
"""
choices = [
  { label = "To go on into the depths of the vale", to = 15 },
