number = 5
key = "05b_bad"
kind = "bad"
image = "05b_bad_v1"
back = 15
text = """
"I beg thy pardon. Pray, let me go home." Thou bowest low.

"Well, well, good manners," saith the witch, grinning. "I may let thee go. After thou hast served me as apprentice for a hundred years."

And so thou becamest the apprentice of the Witch of the Marsh.

Every day thou stirrest the cauldron, choppest herbs, and learnest the making of wisps. Thou hast a gift for it. In time the witch leaveth all the wisp-making to thee.

Of late a strange tale goeth about the village: the newer wisps, having led a traveller astray, courteously hand them a map of the way home.
