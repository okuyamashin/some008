君は長い旅の途中、霧深い沼のほとりにある小さな村にたどり着いた。夕暮れの村には人影が少なく、どの家の戸口にも、魔除けの干し草の束が吊るしてある。

井戸のそばで、杖をついた村長が君を呼び止めた。

「旅のお方、力を貸してくだされ。沼の奥に棲む魔女が、夜ごと鬼火を飛ばしておるのです。鬼火に誘われた牛や羊は沼に迷い込み、戻ってきません。先月は、とうとう若い者が二人いなくなった」

村の向こうの沼では、もう青白い光がふわりふわりと漂い始めている。

君の手もとにあるのは、使い古した旅の道具だけ。それでも村長は、すがるような目で君を見つめている。
