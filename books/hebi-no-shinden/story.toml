# number はパラグラフ番号。本の中ではこの番号で飛ぶ。1 が最初の場面。
# number・kind・choices の to・back は型どおりなので変えない。
# image は images/raw/ の画像名（拡張子なし）。key と合わせて、場面の中身がわかる名前に変えてよい（prompts.md も合わせる）。
# text は空行で段落を分ける。数字は漢数字で書く。

[book]
# 企画（1 冊ごとに決めるのはこの 3 つだけ。記録用で、書き出しには使わない）
antagonist = "黄金の番人"  # 立ちはだかるもの。倒さなくても、説得や謎解きなどで解決すればよい
setting = "密林の神殿（アンデス・中南米風）"  # 舞台
key_item_before = "結び目のほどけた縄"  # 鍵になる持ち物（変わる前）。prompts.md の [Item: before]
key_item_after = "結び目で記した縄"  # 鍵になる持ち物（変わった後）。prompts.md の [Item: after]
# 条件（自由記述。例「子ども向けに、怖い場面は控えめに」「バッドエンドは全部食べ物ネタで」）
notes = """
地域: アンデス・中南米風（catalog/regions.toml の andean から選んだ組み合わせ）
"""

