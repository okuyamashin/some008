「昔、この村の者は、縄の結び目で言葉を記したのじゃ。この縄には、神殿の門を開ける言葉が結ばれておった。だが、長い年月のうちにほどけてしまった」

長老は山道を指さした。

「神殿へ下る道の途中に、石の道しるべがある。そこに、同じ結び目の模様が刻まれておるはずじゃ。その模様どおりに結び直しなされ」

