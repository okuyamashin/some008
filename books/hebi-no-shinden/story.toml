# 『羽毛の蛇の神殿と結び目の縄』本文データ
#
# kind:
#   choice = 選択の場面（choices に 2 つの選択肢）
#   result = 正解の結果の場面（choices に「次へ」1 つ）
#   bad    = バッドエンド（back に戻り先の番号）
