text = """
君は長い旅の途中、雲の上の高地にある小さな村、ティカにたどり着いた。山の斜面には段々畑がどこまでも続き、ラマがのんびりと草を食んでいる。

ところが、畑の作物はどれも茶色く枯れかけていた。村人たちは空の水瓶を抱え、途方に暮れている。

長老が君の前に進み出た。

「旅のお方、どうか力を貸してくだされ。山の下の密林に、羽毛の蛇の神殿がある。そこの黄金の番人が、水の門を閉ざしてしまったのです。水が来なければ、この村は終わりじゃ」

山のふもとには、緑の海のような密林が広がっている。その奥に、石の神殿の頂がかすかに見えた。
"""
choices = [
  { label = "依頼を引き受ける", to = 7 },
  { label = "丁重に断る", to = 12 },
]

