lead = "君が主人公になって、密林の神殿の黄金の番人に会いに行く短い冒険です。場面ごとに道を選び、番号の場面へ進んでください。道を誤ると……どうなるかは、読んでのお楽しみ。"
how_to_play = """
この本では、君が主人公だ。

場面の終わりには、いくつかの選択肢が出てくる。どれか一つを選んで、示された番号の場面へ進んでほしい。

道を誤ると、冒険はそこで終わってしまうこともある。そのときは「やり直す」を選べば、迷った場面へ戻ることができる。

それでは、冒険を始めよう。君の旅は、雲の上の高地にある小さな村から始まる。
"""

