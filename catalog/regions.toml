# 舞台の地域データ（下書き）
#
# 次の本の企画（舞台・立ちはだかるもの・鍵になる持ち物）を自動で選ぶための材料。
# 地域は現実の土地の雰囲気を借りるだけで、本の中では実在の地名・国名・民族名は使わない（架空の土地の名前を付ける）。
# 笑えるバッドエンドは主人公の失敗で笑わせ、その土地の人や文化を笑いのネタにしない。
#
# 地域ごとの項目:
#   name        地域の呼び名（企画用。本文には出さない）
#   mood        雰囲気をひとことで
#   naming      地名を付けるときの音・言葉の感じ
#   art         挿絵の [Scene] に足す、その地域らしさの指示（英語）
#   terrains    舞台になる地形。name は地形、place は地名の例（架空）
#   antagonists 立ちはだかるもの。resolve は解決の仕方（倒す / 和解 / 知恵 / 呪いを解く など）
#               items はその解決に使う鍵になる持ち物の候補（before → after）
#
# 組み合わせ方: 地域を1つ選び、terrains から1つ、antagonists から1つ、その items から1つを選ぶ。

[[region]]
id = "west"
name = "西欧（王道）"
mood = "剣と魔法の、いちばん典型的なファンタジー"
naming = "〇〇の迷宮、〇〇の森のような、日本語の素直な名前"
art = "medieval European villages with thatched roofs, stone castles, oak forests"
terrains = [
  { name = "ダンジョン", place = "竜の迷宮" },
  { name = "森", place = "囁きの森" },
  { name = "沼地", place = "鬼火の沼" },
  { name = "古城", place = "灰色の城" },
  { name = "古い墓地", place = "月影の墓地" },
]
[[region.antagonists]]
name = "黒竜"
resolve = "倒す"
items = [{ before = "錆びた剣", after = "聖剣", note = "1冊目" }]
[[region.antagonists]]
name = "狼の王"
resolve = "和解"
items = [{ before = "ひびの入った角笛", after = "月の角笛", note = "2冊目" }]
[[region.antagonists]]
name = "沼の魔女"
resolve = "知恵"
items = [{ before = "空の古いランタン", after = "鬼火を灯したランタン", note = "3冊目" }]
[[region.antagonists]]
name = "骸骨の騎士"
resolve = "呪いを解く"
items = [{ before = "名前の消えた墓標の破片", after = "名前を刻み直した墓標", note = "名前を思い出させて眠らせる" }]

